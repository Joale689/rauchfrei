<!doctype html>
<html lang="de">
<head>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Rauchfrei</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    .app {
      max-width: 620px;
      margin: 0 auto;
      padding: 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      color: #94a3b8;
      margin: 4px 0 18px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .date {
      font-size: 14px;
      color: #94a3b8;
    }

    .counter {
      font-size: 42px;
      font-weight: 800;
      margin-top: 4px;
    }

    .label {
      color: #cbd5e1;
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    button {
      width: 100%;
      min-height: 64px;
      border: 0;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .cigarette {
      background: #f59e0b;
      color: #111827;
    }

    .first {
      background: #ef4444;
      color: white;
    }

    .vape {
      background: #38bdf8;
      color: #082f49;
    }

    .undo {
      background: #334155;
      color: #f8fafc;
      min-height: 48px;
      font-size: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      background: #0f172a;
      padding: 12px;
      border-radius: 12px;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      margin-top: 3px;
    }

    .events {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .events li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid #334155;
      padding: 10px 0;
    }

    .events li:last-child {
      border-bottom: 0;
    }

    .muted {
      color: #94a3b8;
    }

    .empty {
      color: #94a3b8;
      padding: 10px 0;
    }
  </style>
</head>

<body>
  <main class="app"><p>Rauchfrei wird geladen.</p></main>



<script src="./rauchfrei-v1.0.0.js"></script>
</body>
</html>
